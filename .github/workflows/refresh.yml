# Régénère le site toutes les 6 heures pour mettre à jour l'activité GitHub (page À propos).
name: refresh
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build.py
      - name: Commit if changed
        run: |
          git config user.name "amex-32"
          git config user.email "348891488+amex-32@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Mise à jour de l'activité GitHub" && git push)
