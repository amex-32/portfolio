
  <div id="jeu" class="win fadein">
    <div class="win-title">
      Mini-jeu — 2048
      <div class="win-controls"><i></i><i></i><i></i></div>
    </div>
    <div class="win-body">
      <!-- Top bar -->
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px">
        <button id="g-new" class="xp-btn">Nouvelle partie</button>
        <div style="font-weight:700;color:var(--text2)">Score : <span id="g-score">0</span></div>
        <div style="font-weight:700;color:var(--text2)">Meilleur : <span id="g-best">0</span></div>
        <span id="g-msg" style="color:#c04000;font-weight:700;font-size:12px"></span>
      </div>

      <!-- Board + Leaderboard -->
      <div style="display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start">

        <!-- Board -->
        <div>
          <div id="g2048-board">
            <!-- 16 background cells -->
            <div class="g2048-cell"></div><div class="g2048-cell"></div><div class="g2048-cell"></div><div class="g2048-cell"></div>
            <div class="g2048-cell"></div><div class="g2048-cell"></div><div class="g2048-cell"></div><div class="g2048-cell"></div>
            <div class="g2048-cell"></div><div class="g2048-cell"></div><div class="g2048-cell"></div><div class="g2048-cell"></div>
            <div class="g2048-cell"></div><div class="g2048-cell"></div><div class="g2048-cell"></div><div class="g2048-cell"></div>
          </div>
          <p style="font-size:11px;color:var(--text2);margin-top:6px">Flèches clavier ou swipe mobile</p>
        </div>

        <!-- Leaderboard -->
        <div style="flex:1;min-width:190px">
          <div style="font-weight:800;margin-bottom:6px;display:flex;align-items:center;gap:6px">
            Classement global
            <button id="g-refresh" class="xp-btn" style="padding:2px 8px;font-size:11px">↻</button>
          </div>
          <div id="lb-list"><div style="color:var(--text2);font-size:12px;padding:6px">Chargement…</div></div>
          <div id="lb-status"></div>

          <div style="margin-top:12px;display:flex;flex-direction:column;gap:6px">
            <input id="g-pseudo" placeholder="Votre pseudo" maxlength="30"
                   style="padding:5px 8px;border-radius:4px;border:1px solid rgba(0,100,200,.3);font-size:12px;font-family:inherit;background:rgba(255,255,255,.7)"/>
            <div style="display:flex;gap:6px">
              <button id="g-submit" class="xp-btn">Soumettre score</button>
            </div>
          </div>
          <p style="color:var(--text2);margin-top:8px;font-size:11px;line-height:1.5">
            Un score par pseudo — seul le meilleur est conservé.<br>
            Classement partagé entre tous les visiteurs.
          </p>
        </div>
      </div>
    </div>
  </div>
